name: Daily Instagram Photo Mailer

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time) every single day
    - cron: '30 3 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Test without emailing ABP or saving history)'
        required: false
        type: boolean
        default: false
      test_email:
        description: 'Send test email to this address (leave empty for ABP Nadia)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run-mailer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Photo Mailer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'pixell.poet' }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL || 'edit.nadia@abp.in' }}
          INSTAGRAM_SESSION_BASE64: ${{ secrets.INSTAGRAM_SESSION_BASE64 }}
        run: |
          CMD_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ -n "${{ inputs.test_email }}" ]; then
            CMD_ARGS="$CMD_ARGS --test-email ${{ inputs.test_email }}"
          fi

          python main.py $CMD_ARGS

      - name: Commit and Push Updated History
        if: success() && inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record sent photo [skip ci]"
            git push
            echo "Successfully pushed updated sent_history.json to repository."
          else
            echo "No changes to sent_history.json."
          fi

name: Daily Instagram Photo Mailer

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST (Indian Standard Time) every single day
    - cron: '30 4 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Test without emailing ABP or saving history)'
        required: false
        type: boolean
        default: false
      test_email:
        description: 'Send test email to this address (leave empty for ABP Nadia)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run-mailer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Queue (pre-send)
        env:
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'pixell.poet' }}
        run: |
          echo "Refreshing queue.json with fresh CDN URLs..."
          python sync_queue.py || echo "Queue refresh failed (expected on cloud). Using existing queue.json."

      - name: Run Daily Photo Mailer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'pixell.poet' }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL || 'edit.nadia@abp.in' }}
          INSTAGRAM_SESSION_BASE64: ${{ secrets.INSTAGRAM_SESSION_BASE64 }}
        run: |
          CMD_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          else
            CMD_ARGS="$CMD_ARGS --force-send"
          fi
          if [ -n "${{ inputs.test_email }}" ]; then
            CMD_ARGS="$CMD_ARGS --test-email ${{ inputs.test_email }}"
          fi

          python main.py $CMD_ARGS

      - name: Commit and Push Updated History & Queue
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json queue.json settings.json queue_images/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update queue and history [skip ci]"
            git push
            echo "Successfully pushed updates to repository."
          else
            echo "No changes to commit."
          fi
